<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iso-prerender — HOMESTEAD 98</title>
<!--
  Link-unfurl metadata for the GitHub Pages deployment. The repository's Social
  preview image only covers the repository URL; this page is a separate URL on a
  separate domain (he1ta0.github.io) and gets no card at all without its own tags.

  og:image must be absolute - QQ, WeChat and most crawlers will not fetch a
  relative one. These point at the Pages deployment, so a fork would want to
  change them.
-->
<meta name="description" content="一条给 2:1 等距游戏用的离线预渲染管线：离线烘精灵图集，运行时实时光照。附一个农场场景切片，点开即玩。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="iso-prerender">
<meta property="og:title" content="iso-prerender — 2:1 等距预渲染管线">
<meta property="og:description" content="离线预渲染精灵图集，运行时实时光照。附一个农场场景切片，点开即玩。">
<meta property="og:url" content="https://he1ta0.github.io/iso-prerender/">
<meta property="og:image" content="https://he1ta0.github.io/iso-prerender/docs/img/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060a;
    /* a very slight phosphor tint on the letterbox so the frame feels like a screen */
    background-image: radial-gradient(ellipse at 50% 45%, #0b0e18 0%, #05060a 70%);
  }
  #wrap { position: absolute; }
  canvas {
    position: absolute; left: 0; top: 0; display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  /* scanline veil over the whole screen — off by default, toggle with class */
  #wrap.crt::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px,
      rgba(0,0,0,0.00) 1px, rgba(0,0,0,0.00) 2px);
    mix-blend-mode: multiply;
  }
  #ui { pointer-events: auto; cursor: default; }
  #boot {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7d90a8; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.14em; text-align: center; white-space: pre;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="gl"></canvas>
    <canvas id="ui"></canvas>
  </div>
  <div id="boot">LOADING ASSETS…</div>
  <script type="module">
    const boot = document.getElementById('boot');
    window.addEventListener('error', (e) => {
      boot.style.display = 'flex';
      boot.style.color = '#d9705a';
      boot.textContent = 'ERROR\n' + (e.message || e.error || 'unknown');
    });
    import('./src/main.js').then(() => { boot.style.display = 'none'; })
      .catch((err) => {
        boot.style.color = '#d9705a';
        boot.textContent = 'BOOT FAILED\n' + (err && err.message ? err.message : err);
        console.error(err);
      });
  </script>
</body>
</html>
